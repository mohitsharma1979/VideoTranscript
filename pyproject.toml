[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcript"
version = "0.1.0"
description = "Offline, CLI-first video transcription with timestamps and simple chapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "psutil>=5.9,<8",
]

[project.scripts]
video-transcript = "video_transcript.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["video_transcript*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
